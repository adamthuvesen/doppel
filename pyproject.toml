[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doppeldata"
version = "0.1.0"
description = "Synthetic data that looks real — a statistical double of your dataset."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Adam Thuvesen" }]
keywords = [
    "synthetic-data",
    "data-generation",
    "tabular-data",
    "privacy",
    "testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "polars>=2.1",
    "duckdb>=2.0",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "numpy>=2.5",
    "pydantic>=2.14",
    "typer>=0.29",
    "rich>=15.0",
    "tomli-w>=1.2",
    "pyarrow>=26.0",
]

[project.optional-dependencies]
pii = ["presidio-analyzer>=2.2.362", "faker>=40.54", "spacy>=3.8.18", "en-core-web-lg"]
sql = ["connectorx>=0.4.6"]
all = ["doppeldata[pii,sql]"]

[project.scripts]
doppel = "doppel.__main__:app"

[project.urls]
Repository = "https://github.com/adamthuvesen/doppel"
Issues = "https://github.com/adamthuvesen/doppel/issues"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff==0.17.4",
    "basedpyright==1.40.2",
    "pglast>=8.7",
    "scipy-stubs>=1.18.1.1",
]

[tool.uv.sources]
# Not on PyPI: spaCy publishes models as release wheels. Locking the URL keeps the model in uv.lock.
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/doppel"]

[tool.hatch.build.targets.sdist]
include = ["src/doppel", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "N",      # pep8-naming
    "ANN",    # flake8-annotations (lite)
    "C4",     # flake8-comprehensions
    "PTH",    # flake8-use-pathlib
    "PGH003", # a type ignore must name its rule
]
ignore = [
    "E501",   # handled by formatter
    "ANN401", # allow Any in narrow cases
]

[tool.ruff.lint.per-file-ignores]
# Tests skip annotation/assert-style checks; PII tests need to import after `importorskip`.
"tests/**/*.py" = ["ANN", "S101", "E402"]

[tool.ruff.lint.flake8-bugbear]
# Typer's whole API uses function calls as argument defaults — canonical pattern.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportIgnoreCommentWithoutRule = "error"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
executionEnvironments = [
    { root = "tests", extraPaths = ["src"], reportMissingParameterType = false, reportPrivateUsage = false },
    { root = "src" },
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not slow",
]
markers = [
    "slow: marks tests as slow (run explicitly with '-m slow')",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["src/doppel"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
